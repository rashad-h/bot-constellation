<style>
  :root {
    --fg: #eef2ff;
    --dim: rgba(220, 228, 255, .62);
    --glass: rgba(14, 18, 40, .42);
    --edge: rgba(255, 255, 255, .14);
    --gold: #ffd166;
    --sans: 'Space Grotesk', system-ui, sans-serif;
    --mono: 'JetBrains Mono', ui-monospace, monospace;
    font-size: clamp(14px, 1.05vw, 24px);
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; background: #01010a; color: var(--fg); font-family: var(--sans); overflow: hidden; }
  #scene { position: fixed; inset: 0; }
  #scene canvas { display: block; }
  .hud { position: fixed; z-index: 5; transition: opacity .6s ease; pointer-events: none; }
  body.hud-hidden .hud, body.arriving #qr, body.arriving #stats { opacity: 0; }
  .panel { background: linear-gradient(160deg, rgba(22, 28, 56, .62), rgba(10, 13, 30, .52)); border: 1px solid rgba(255,255,255,.1);
    border-radius: 20px; backdrop-filter: blur(18px) saturate(150%); -webkit-backdrop-filter: blur(18px) saturate(150%);
    box-shadow: 0 20px 50px rgba(0,0,0,.35), inset 0 1px 0 rgba(255,255,255,.08); }
  .eyebrow { font-family: var(--mono); font-size: .68rem; font-weight: 700; letter-spacing: .2em; text-transform: uppercase; color: var(--dim); }
  #vignette { position: fixed; inset: 0; z-index: 3; pointer-events: none;
    background: linear-gradient(180deg, rgba(2,3,10,.7) 0%, transparent 22%, transparent 70%, rgba(2,3,10,.75) 100%),
                radial-gradient(ellipse at 50% 55%, transparent 55%, rgba(2,3,10,.55) 100%); }

  /* top-left title */
  #title { top: 1.8rem; left: 2rem; }
  #title .row { display: flex; gap: .6rem; align-items: center; margin-bottom: .7rem; }
  #title h1 { margin: 0; font-size: 2.7rem; font-weight: 700; letter-spacing: -.02em; line-height: 1; color: #fff; text-shadow: 0 2px 30px rgba(120, 160, 255, .35); }
  #title h1 span { background: linear-gradient(90deg, #9fd8ff, #c9a7ff 60%, #ff9ad5); -webkit-background-clip: text; background-clip: text; color: transparent; }
  #eventName { margin-top: .5rem; font-size: 1.05rem; color: var(--dim); }
  .live { display: inline-flex; align-items: center; gap: .5rem; font-family: var(--mono); font-size: .72rem; font-weight: 700; letter-spacing: .18em; padding: .32rem .7rem; border-radius: 999px;
    border: 1px solid rgba(255,255,255,.12); background: rgba(8,10,24,.6); }
  .live i { width: .55rem; height: .55rem; border-radius: 50%; background: #888; }
  .live.on { border-color: rgba(255, 70, 100, .45); }
  .live.on i { background: #ff3b5c; box-shadow: 0 0 0 0 rgba(255,59,92,.6); animation: ping 1.6s infinite; }
  .live.warn i { background: #ffb020; }
  .badge-demo { font-family: var(--mono); font-size: .68rem; font-weight: 700; letter-spacing: .18em; color: #1a1300; background: var(--gold); padding: .34rem .6rem; border-radius: 999px; }
  @keyframes ping { 70% { box-shadow: 0 0 0 .55rem rgba(255,59,92,0); } 100% { box-shadow: 0 0 0 0 rgba(255,59,92,0); } }
  @keyframes blink { 50% { opacity: .25; } }

  /* top-right stats */
  #stats { top: 1.6rem; right: 1.8rem; padding: 1.2rem 1.3rem 1rem; width: 21rem; }
  .counters { display: grid; grid-template-columns: 1fr 1fr; gap: 1rem; padding-bottom: 1rem; border-bottom: 1px solid rgba(255,255,255,.08); }
  .counter .n { font-size: 3rem; font-weight: 700; line-height: 1; letter-spacing: -.03em; font-variant-numeric: tabular-nums; transition: transform .3s, color .3s; display: inline-block; transform-origin: left bottom; }
  .counter .n.bump { transform: scale(1.18); color: var(--gold); }
  .counter .l { margin-top: .4rem; }
  #tracks { margin-top: .8rem; display: grid; gap: .3rem; }
  .trk { position: relative; display: grid; grid-template-columns: .6rem 1fr auto; align-items: center; gap: .65rem; padding: .38rem .6rem; border-radius: 10px; font-size: .88rem; overflow: hidden; }
  .trk .bar { position: absolute; inset: 0; z-index: -1; }
  .trk .bar i { display: block; height: 100%; width: 0; background: linear-gradient(90deg, color-mix(in srgb, var(--c) 30%, transparent), color-mix(in srgb, var(--c) 8%, transparent)); transition: width .9s cubic-bezier(.2,.9,.2,1); }
  .trk .dot { width: .6rem; height: .6rem; border-radius: 50%; background: var(--c); box-shadow: 0 0 10px var(--c); }
  .trk .name { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; color: rgba(235,240,255,.85); }
  .trk .cnt { font-family: var(--mono); font-weight: 700; font-variant-numeric: tabular-nums; }

  /* bottom-left feed */
  #feed { left: 2rem; bottom: 1.8rem; width: min(34rem, 42vw); transition: opacity .6s; }
  #feed:has(ul:empty) { opacity: 0; }
  #feed .eyebrow { margin: 0 0 .6rem .2rem; }
  #feed ul { list-style: none; margin: 0; padding: 0; display: grid; gap: .4rem; }
  #feed li { display: grid; grid-template-columns: 1.6rem 1fr auto; align-items: center; gap: .4rem; padding: .55rem .85rem; border-radius: 14px; font-size: .95rem; line-height: 1.3;
    background: rgba(12, 16, 36, .62); border: 1px solid rgba(255,255,255,.08); backdrop-filter: blur(12px); -webkit-backdrop-filter: blur(12px); animation: slidein .5s cubic-bezier(.2,1,.3,1); }
  #feed li:nth-child(n+4) { opacity: .65; } #feed li:nth-child(n+6) { opacity: .35; } #feed li:nth-child(n+7) { display: none; }
  #feed .t { font-family: var(--mono); font-size: .7rem; color: var(--dim); }
  #feed .m { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  #feed .h { font-weight: 700; }
  @keyframes slidein { from { opacity: 0; transform: translateY(12px) scale(.97); } }

  /* bottom-right QR */
  #qr { right: 1.8rem; bottom: 1.8rem; padding: .9rem 1.2rem .9rem .9rem; display: flex; gap: 1.1rem; align-items: center; }
  #qrcode { background: #fff; padding: .4rem; border-radius: 12px; line-height: 0; }
  #qrcode img, #qrcode canvas { width: 7.5rem !important; height: 7.5rem !important; }
  #qr .cta { max-width: 11rem; }
  #qr .cta b { display: block; margin: .35rem 0 .3rem; font-size: 1.35rem; line-height: 1.15; }
  #qr .cta small { display: block; font-size: .85rem; color: var(--dim); line-height: 1.35; }
  #qr .cta em { font-style: normal; color: #9fd8ff; font-weight: 700; }

  /* keys hint */
  #keys { bottom: .7rem; left: 50%; transform: translateX(-50%); font-family: var(--mono); font-size: .66rem; color: rgba(255,255,255,.4); letter-spacing: .12em; transition: opacity 2s; white-space: nowrap; }
  #keys.fade { opacity: 0; }

  /* arrival card */
  #arrival { position: fixed; z-index: 7; top: 50%; left: 53%; width: min(46vw, 52rem); transform: translateY(-50%) scale(.92); opacity: 0; pointer-events: none;

    border: 1px solid rgba(255,255,255,.22); backdrop-filter: blur(22px) saturate(160%); -webkit-backdrop-filter: blur(22px) saturate(160%);
    box-shadow: 0 0 0 1px color-mix(in srgb, var(--c) 40%, transparent), 0 0 80px color-mix(in srgb, var(--c) 45%, transparent), inset 0 1px 0 rgba(255,255,255,.25);
    transition: opacity .55s ease, transform .7s cubic-bezier(.2,1.2,.3,1), filter .6s; filter: blur(8px); overflow: hidden; }
  #arrival.show { opacity: 1; transform: translateY(-50%) scale(1); filter: none; }
  #arrival::before { content: ''; position: absolute; inset: 0; background: linear-gradient(110deg, transparent 30%, rgba(255,255,255,.14) 48%, transparent 66%); transform: translateX(-100%); }
  #arrival.show::before { animation: sheen 1.6s .3s ease-out; }
  @keyframes sheen { to { transform: translateX(100%); } }
  #arrival .top { display: flex; justify-content: space-between; align-items: center; }
  #arrival .pill { font-family: var(--mono); font-weight: 700; letter-spacing: .22em; font-size: .95rem; padding: .35rem .85rem; border-radius: 999px; color: #04040a; background: var(--c); box-shadow: 0 0 24px var(--c); animation: blink 1s infinite; }
  #arrival .num { font-family: var(--mono); font-size: 2.6rem; font-weight: 700; color: transparent; -webkit-text-stroke: 1.5px rgba(255,255,255,.55); }
  #arrival .bot { margin: 1.1rem 0 .2rem; font-size: clamp(3rem, 5.8vw, 7.5rem); font-weight: 700; line-height: .95; letter-spacing: -.02em; overflow-wrap: anywhere;
    text-shadow: 0 0 40px color-mix(in srgb, var(--c) 70%, transparent); }
  #arrival .who { display: flex; align-items: center; gap: 1.4rem; margin-top: 1rem; }
  #arrival .who img { width: clamp(5rem, 8vw, 10rem); flex: none; filter: drop-shadow(0 0 24px var(--c)); animation: bob 2.4s ease-in-out infinite; }
  #arrival .who .bot { margin: 0; }
  @keyframes bob { 50% { transform: translateY(-8px) rotate(-3deg); } }
  #arrival .op { font-size: 1.35rem; color: var(--dim); }
  #arrival .op b { color: var(--fg); }
  #arrival .building { margin-top: 1.2rem; font-size: 1.55rem; line-height: 1.35; overflow-wrap: anywhere; }
  #arrival .building span { font-family: var(--mono); font-size: .85rem; letter-spacing: .18em; color: var(--c); display: block; margin-bottom: .25rem; }
  #arrival .chips { margin-top: 1.2rem; display: flex; flex-wrap: wrap; gap: .5rem; }
  .chip { padding: .32rem .8rem; border-radius: 999px; font-size: .95rem; border: 1px solid rgba(255,255,255,.25); background: rgba(255,255,255,.07); }
  .chip.li { border-color: rgba(10,102,194,.8); background: rgba(10,102,194,.25); color: #cfe6ff; }
  .chip.track { border-color: var(--c); color: var(--c); background: color-mix(in srgb, var(--c) 14%, transparent); font-weight: 700; }
  #arrival .cls { margin-top: 1.3rem; display: flex; align-items: center; gap: .8rem; font-size: 1.25rem; }
  #arrival .cls .ico { font-size: 2.2rem; filter: drop-shadow(0 0 12px var(--c)); }
  #arrival .cls b { font-size: 1.6rem; color: var(--gold); }
  #arrival .cls small { display: block; font-family: var(--mono); font-size: .72rem; letter-spacing: .18em; color: var(--dim); }
  #arrival .fun { margin-top: .9rem; font-size: 1rem; color: var(--dim); font-style: italic; }

  #flash { position: fixed; inset: 0; z-index: 4; pointer-events: none; opacity: 0; background: radial-gradient(circle at 30% 50%, color-mix(in srgb, var(--c, #fff) 35%, transparent), transparent 55%); }
  #flash.go { animation: flash 1.4s ease-out; }
  @keyframes flash { 10% { opacity: 1; } to { opacity: 0; } }

  @media (max-width: 800px) {
    :root { font-size: 13px; }
    #stats, #qr .cta, #tracks, #keys { display: none; }
    #title { top: 1rem; left: 1rem; } #title h1 { font-size: 2rem; }
    #feed { width: calc(100vw - 2rem); left: 1rem; bottom: 1rem; }
    #qr { top: 1rem; bottom: auto; right: 1rem; padding: .5rem; }
    #qrcode img, #qrcode canvas { width: 4.5rem !important; height: 4.5rem !important; }
    #arrival { left: 4vw; width: 92vw; }
  }
</style>

<script type="module">
import * as THREE from 'three';
import SpriteText from 'https://cdn.jsdelivr.net/npm/three-spritetext@1.10.0/dist/three-spritetext.mjs';
import { RoundedBoxGeometry } from 'https://cdn.jsdelivr.net/npm/three@0.186.1/examples/jsm/geometries/RoundedBoxGeometry.js/+esm';
import { RoomEnvironment } from 'https://cdn.jsdelivr.net/npm/three@0.186.1/examples/jsm/environments/RoomEnvironment.js/+esm';

const C = window.CONFIG;
const params = new URLSearchParams(location.search);
const HAS_DB = !!(C.SUPABASE_URL && C.SUPABASE_ANON_KEY);
const DEMO = !HAS_DB || params.get('demo') === '1';
const FONT = "'Space Grotesk', system-ui, sans-serif";
const MONO = "'JetBrains Mono', ui-monospace, monospace";
const $ = id => document.getElementById(id);
const sleep = ms => new Promise(r => setTimeout(r, ms));
const rand = (a, b) => a + Math.random() * (b - a);
// Wait for web fonts so canvas/sprite text renders in the right face.
await Promise.race([document.fonts.ready, sleep(2500)]);

// ───────────────────────── tracks & helpers ─────────────────────────
// Body colours follow the Grok Bot avatar palette; `ui` is the brighter tint used for glow and text.
const TRACKS = [
  { id: 'gatekeeper',         label: 'Gatekeeper',         color: '#e5534b', ui: '#ff6b62' },
  { id: 'know-your-members',  label: 'Know Your Members',  color: '#3fb8a9', ui: '#4fe3cf' },
  { id: 'event-autopilot',    label: 'Event Autopilot',    color: '#8b5cf6', ui: '#a98bff' },
  { id: 'open-venue-db',      label: 'Open Venue DB',      color: '#5cc77a', ui: '#6cf091' },
  { id: 'front-desk-revenue', label: 'Front Desk Revenue', color: '#ee9a3a', ui: '#ffb04f' },
  { id: 'weird-stuff',        label: 'Weird Stuff',        color: '#dd5fb8', ui: '#ff7ad6' },
];
const TRACK = Object.fromEntries(TRACKS.map(t => [t.id, t]));
const NO_TRACK = { id: null, label: 'Free Roaming', color: '#16161c', ui: '#c9d4ff' };

// All user-supplied text is untrusted: strip control chars, cap length, and only ever
// render it via textContent (DOM) or canvas fillText (sprites).
const clean = (s, n) => String(s ?? '').replace(/[\u0000-\u001f\u007f​-‏‪-‮]/g, ' ').replace(/\s+/g, ' ').trim().slice(0, n);
function sanitize(r) {
  const handle = clean(r.x_handle, 40).replace(/^@+/, '');
  if (!handle) return null;
  const skills = (Array.isArray(r.skills) ? r.skills : []).map(s => clean(s, 24)).filter(Boolean).slice(0, 6);
  return {
    handle, key: handle.toLowerCase(),
    name: clean(r.display_name, 60) || handle,
    bot: clean(r.bot_name, 40) || 'Grok Bot',
    building: clean(r.building, 140),
    skills,
    track: TRACK[r.track] ? r.track : null,
    fun: clean(r.fun_fact, 80),
    linkedin: (String(r.linkedin_url ?? '').match(/linkedin\.com\/in\/([A-Za-z0-9_%-]{2,100})/) || [])[1] || '',
  };
}
const hash = s => [...s].reduce((h, c) => (h * 31 + c.charCodeAt(0)) >>> 0, 7);

const CLASSES = [
  ['Architect', '🏛️', ['backend', 'infra', 'database', 'sql', 'postgres', 'go', 'rust', 'cloud', 'devops', 'api', 'systems', 'neo4j', 'graph', 'scraping', 'maps', 'kubernetes']],
  ['Oracle', '🔮', ['ml', 'ai', 'llm', 'data', 'python', 'nlp', 'embeddings', 'rag', 'agents', 'analytics', 'vision', 'pytorch']],
  ['Illusionist', '🎭', ['design', 'ui', 'ux', 'frontend', 'react', '3d', 'css', 'animation', 'figma', 'audio', 'music', 'three', 'generative', 'art']],
  ['Herald', '📯', ['community', 'content', 'marketing', 'growth', 'social', 'writing', 'poetry', 'comms', 'voice', 'product']],
  ['Sentinel', '🛡️', ['security', 'auth', 'privacy', 'crypto', 'testing', 'qa', 'iot', 'payments', 'stripe', 'hardware']],
];
const ADJ = ['Neon', 'Quantum', 'Midnight', 'Solar', 'Rogue', 'Velvet', 'Chrome', 'Feral', 'Lunar', 'Turbo', 'Arcane', 'Glitch', 'Cosmic', 'Silent'];
function botClass(p) {
  const sk = p.skills.map(s => s.toLowerCase());
  let best = ['Wanderer', '🧭'], score = 0;
  for (const [name, ico, kws] of CLASSES) {
    const s = sk.filter(x => kws.some(k => k.length <= 3 ? x === k : x.includes(k))).length;
    if (s > score) { score = s; best = [name, ico]; }
  }
  return { name: `${ADJ[hash(p.key) % ADJ.length]} ${best[0]}`, icon: best[1] };
}

// ───────────────────────── renderer, scene, camera ─────────────────────────
const renderer = new THREE.WebGLRenderer({ antialias: true, powerPreference: 'high-performance' });
renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
renderer.setSize(innerWidth, innerHeight);
renderer.toneMapping = THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure = 1.05;
$('scene').append(renderer.domElement);
const scene = new THREE.Scene();
scene.background = new THREE.Color('#02030a');
const pmrem = new THREE.PMREMGenerator(renderer);
scene.environment = pmrem.fromScene(new RoomEnvironment(), .04).texture;
scene.environmentIntensity = .45;
const camera = new THREE.PerspectiveCamera(45, innerWidth / innerHeight, .1, 4000);

let composer = null;
addEventListener('resize', () => {
  camera.aspect = innerWidth / innerHeight; camera.updateProjectionMatrix();
  renderer.setSize(innerWidth, innerHeight); composer?.setSize(innerWidth, innerHeight);
});

// Bloom is optional: if any add-on fails to load we keep rendering without it.
(async () => {
  if (params.get('bloom') === '0') return;
  try {
    const base = 'https://cdn.jsdelivr.net/npm/three@0.186.1/examples/jsm/postprocessing/';
    const [{ EffectComposer }, { RenderPass }, { UnrealBloomPass }, { OutputPass }] = await Promise.all(
      ['EffectComposer', 'RenderPass', 'UnrealBloomPass', 'OutputPass'].map(n => import(`${base}${n}.js/+esm`)));
    const c = new EffectComposer(renderer);
    c.addPass(new RenderPass(scene, camera));
    c.addPass(new UnrealBloomPass(new THREE.Vector2(innerWidth, innerHeight), .55, .45, .9));
    c.addPass(new OutputPass());
    composer = c;
  } catch (e) { console.warn('Bloom unavailable, continuing without it:', e); }
})();

// ───────────────────────── textures ─────────────────────────
function canvas(w, h = w) { const c = document.createElement('canvas'); c.width = w; c.height = h; return [c, c.getContext('2d')]; }
function canvasTex(c) { const t = new THREE.CanvasTexture(c); t.colorSpace = THREE.SRGBColorSpace; t.anisotropy = 8; return t; }
const radialTex = (stops) => {
  const [c, g] = canvas(128), gr = g.createRadialGradient(64, 64, 0, 64, 64, 64);
  stops.forEach(([o, a]) => gr.addColorStop(o, `rgba(255,255,255,${a})`));
  g.fillStyle = gr; g.fillRect(0, 0, 128, 128); return canvasTex(c);
};
const glowTex = radialTex([[0, 1], [.2, .55], [.5, .12], [1, 0]]);
const shadowTex = (() => {
  const [c, g] = canvas(128), gr = g.createRadialGradient(64, 64, 0, 64, 64, 64);
  gr.addColorStop(0, 'rgba(0,0,0,.65)'); gr.addColorStop(.6, 'rgba(0,0,0,.25)'); gr.addColorStop(1, 'rgba(0,0,0,0)');
  g.fillStyle = gr; g.fillRect(0, 0, 128, 128); return canvasTex(c);
})();
const beamTex = (() => {
  const [c, g] = canvas(4, 256), gr = g.createLinearGradient(0, 0, 0, 256);
  gr.addColorStop(0, 'rgba(255,255,255,0)'); gr.addColorStop(.7, 'rgba(255,255,255,.35)'); gr.addColorStop(1, 'rgba(255,255,255,1)');

const SHAPES = ['circle', 'pebble', 'squircle', 'capsule', 'triangle', 'hexagon', 'cloud', 'droplet'];
function shapeGeos(shape) {
  switch (shape) {

    case 'triangle': {

    }
    case 'hexagon': { const g = new THREE.CylinderGeometry(.95, .95, 1.1, 6); g.rotateX(Math.PI / 2); g.rotateZ(Math.PI / 6); return [[g]]; }
    case 'cloud': return [[new THREE.SphereGeometry(.6, 28, 20), [-.5, -.1, 0]], [new THREE.SphereGeometry(.72, 28, 20), [.15, .1, 0]], [new THREE.SphereGeometry(.55, 28, 20), [.7, -.15, 0]], [new THREE.SphereGeometry(.5, 28, 20), [-.05, .55, -.1]]];
    case 'droplet': {
      const pts = []; for (let i = 0; i <= 40; i++) { const th = Math.PI - i / 40 * Math.PI; pts.push(new THREE.Vector2(Math.sin(th) * Math.sin(th / 2) * 1.05, Math.cos(th) * .95)); }

  }
}
const eyeGeo = (() => { const g = new THREE.CapsuleGeometry(.11, .26, 6, 16); g.scale(1, 1, .45); return g; })();
const eyeMat = new THREE.MeshBasicMaterial({ color: '#ffffff', toneMapped: false });
const BOT_SCALE = 1.45;
const shapeCache = {};
// Build the body once per shape: centre it, sit it on y=0, and raycast the front surface to place the eyes.
function shapeTemplate(shape) {
  if (shapeCache[shape]) return shapeCache[shape];
  const parts = shapeGeos(shape), tmp = new THREE.Group();
  for (const [geo, off] of parts) { const m = new THREE.Mesh(geo); if (off) m.position.set(...off); tmp.add(m); }
  tmp.updateMatrixWorld(true);
  const box = new THREE.Box3().setFromObject(tmp), size = box.getSize(new THREE.Vector3()), mid = box.getCenter(new THREE.Vector3());
  const offset = new THREE.Vector3(-mid.x, -box.min.y, -mid.z);
  tmp.position.copy(offset); tmp.updateMatrixWorld(true);
  const ray = new THREE.Raycaster(), eyes = [];
  const ey = size.y * (shape === 'triangle' ? .45 : shape === 'droplet' ? .5 : .62);
  for (const ex of [-.2, .24]) {
    const x = ex * Math.min(1.3, size.x / 1.6) + .1;
    ray.set(new THREE.Vector3(x, ey, 10), new THREE.Vector3(0, 0, -1));
    const hit = ray.intersectObject(tmp, true)[0];
    if (!hit) continue;
    const n = hit.face.normal.clone().transformDirection(hit.object.matrixWorld);
    eyes.push({ pos: hit.point.clone().addScaledVector(n, .015), quat: new THREE.Quaternion().setFromUnitVectors(new THREE.Vector3(0, 0, 1), n) });
  }
  return (shapeCache[shape] = { parts, offset, height: size.y, width: Math.max(size.x, size.z), eyes });
}

// Speech bubble: canvas-drawn, word-wrapped, length-capped, typewriter animation.
const BUB = { font: 40, lineH: 50, pad: 30, labelH: 40, maxW: 640, tail: 24, scale: .0005, maxLines: 3 };
function wrap(ctx, text, maxW, maxLines) {
  const lines = []; let cur = '';
  for (let w of text.split(' ').filter(Boolean)) {
    while (ctx.measureText(w).width > maxW) {
      let i = w.length; while (i > 1 && ctx.measureText(w.slice(0, i)).width > maxW) i--;
      if (cur) { lines.push(cur); cur = ''; }
      lines.push(w.slice(0, i)); w = w.slice(i);
    }
    const t = cur ? cur + ' ' + w : w;
    if (ctx.measureText(t).width <= maxW) cur = t; else { lines.push(cur); cur = w; }
  }
  if (cur) lines.push(cur);
  if (lines.length > maxLines) {
    lines.length = maxLines;
    let l = lines[maxLines - 1]; while (l && ctx.measureText(l + '…').width > maxW) l = l.slice(0, -1);
    lines[maxLines - 1] = l.trimEnd() + '…';
  }
  return lines.length ? lines : ['…'];
}
class Bubble {
  constructor(color) {
    this.color = color;
    // fixed on-screen size so bubbles stay readable from any distance
    this.mat = new THREE.SpriteMaterial({ transparent: true, depthWrite: false, depthTest: false, sizeAttenuation: false, toneMapped: false });
    this.sprite = new THREE.Sprite(this.mat);
    this.sprite.center.set(.5, 0); this.sprite.renderOrder = 20;
    this.base = new THREE.Vector2(1, 1);
  }
  set(text, tag, animate) {
    const [c, ctx] = canvas(8);
    ctx.font = `500 ${BUB.font}px ${FONT}`;
    const lines = wrap(ctx, clean(text, 140) || '…', BUB.maxW, BUB.maxLines);
    c.width = Math.ceil(Math.max(320, ...lines.map(l => ctx.measureText(l).width)) + BUB.pad * 2);
    c.height = Math.ceil(BUB.pad * 2 + BUB.labelH + lines.length * BUB.lineH + BUB.tail);
    Object.assign(this, { c, ctx, lines, tag, total: lines.join('').length });
    this.tex?.dispose(); this.tex = canvasTex(c);
    this.mat.map = this.tex; this.mat.needsUpdate = true;
    this.base.set(c.width * BUB.scale, c.height * BUB.scale);
    this.anim = animate ? { t0: performance.now() } : null;
    this.draw(animate ? 0 : this.total);
  }
  draw(n) {
    const { c, ctx } = this, x0 = 3, y0 = 3, x1 = c.width - 3, y1 = c.height - BUB.tail - 3, r = 26, cx = c.width / 2;
    ctx.clearRect(0, 0, c.width, c.height);
    ctx.beginPath();
    ctx.moveTo(x0 + r, y0); ctx.lineTo(x1 - r, y0); ctx.arcTo(x1, y0, x1, y0 + r, r);
    ctx.lineTo(x1, y1 - r); ctx.arcTo(x1, y1, x1 - r, y1, r);
    ctx.lineTo(cx + 20, y1); ctx.lineTo(cx, y1 + BUB.tail - 2); ctx.lineTo(cx - 20, y1);
    ctx.lineTo(x0 + r, y1); ctx.arcTo(x0, y1, x0, y1 - r, r); ctx.lineTo(x0, y0 + r); ctx.arcTo(x0, y0, x0 + r, y0, r);
    ctx.closePath();
    ctx.fillStyle = 'rgba(8, 11, 26, .86)'; ctx.fill();
    ctx.lineWidth = 4; ctx.strokeStyle = this.color; ctx.stroke();
    ctx.font = `700 24px ${MONO}`; ctx.fillStyle = this.color;
    ctx.fillText(this.tag, BUB.pad, BUB.pad + 22);
    ctx.font = `500 ${BUB.font}px ${FONT}`; ctx.fillStyle = '#d9dff2';
    let left = n, y = BUB.pad + BUB.labelH;
    for (const line of this.lines) {
      y += BUB.lineH;
      const s = line.slice(0, Math.max(0, left)); left -= line.length;
      ctx.fillText(s, BUB.pad, y - 12);
      if (this.anim && left < 0 && s.length < line.length) {
        ctx.fillStyle = this.color; ctx.fillText('▍', BUB.pad + ctx.measureText(s).width + 2, y - 12); break;
      }
    }
    this.tex.needsUpdate = true;
  }
  tick(now) {
    if (!this.anim) return;
    const n = Math.floor((now - this.anim.t0) / 24);
    if (n >= this.total) { this.anim = null; this.draw(this.total); } else this.draw(n);
  }
}

// floor shockwave rings
const waves = [];
function shockwave(pos, color) {
  const m = flat(new THREE.Mesh(new THREE.RingGeometry(.9, 1, 96), new THREE.MeshBasicMaterial({ color, transparent: true, blending: THREE.AdditiveBlending, depthWrite: false, toneMapped: false })), .06);

// ───────────────────────── behaviour ─────────────────────────
const EXPR = {  // eye scale (x, y) and vertical shift per expression
  neutral: [1, 1, 0], blink: [1.1, .12, 0], happy: [1.15, .3, .04], surprised: [1.45, .85, .02], sleepy: [1.1, .22, -.03],
};
let beamUntil = 0, cardUp = false;
const tmpV = new THREE.Vector3();
const angLerp = (a, b, t) => { const d = Math.atan2(Math.sin(b - a), Math.cos(b - a)); return a + d * t; };

function updateBot(b, now, dt) {
  let hopY = 0, sy = 1 + Math.sin(now * .003 + b.phase) * .025;
  if (b.mode === 'arrive') {
    const t = (now - b.t0) / 1000;
    if (t < .9) { const k = t / .9; hopY = 9 * (1 - k * k); sy = 1.35; }
    else if (t < 1.4) { const k = (t - .9) / .5; sy = 1 - Math.sin(k * Math.PI) * .32; }
    else if (t < 2) { const k = (t - 1.4) / .6; hopY = Math.sin(k * Math.PI) * .9; sy = 1.06; }
    else if (!b.hold) { b.target = homeSpot(b); b.mode = 'walk'; b.rush = true; }
    b.heading = angLerp(b.heading, Math.atan2(camera.position.x - b.pos.x, camera.position.z - b.pos.z), dt * 3);
  } else if (b.mode === 'celebrate') {
    const t = (now - b.t0) / 1000;
    if (t < 1.3) { hopY = Math.abs(Math.sin(t / 1.3 * Math.PI * 2)) * 1.1; b.heading += dt * 9; sy = 1.05; }
    else { b.mode = 'idle'; b.until = now + rand(1500, 3000); }
  } else if (b.mode === 'walk') {
    tmpV.subVectors(b.target, b.pos); tmpV.y = 0;
    const d = tmpV.length();
    if (d < .25) { b.mode = 'idle'; b.rush = false; b.until = now + rand(1500, 6000); }
    else {
      b.heading = angLerp(b.heading, Math.atan2(tmpV.x, tmpV.z), dt * 6);
      b.pos.addScaledVector(tmpV.normalize(), Math.min(d, b.speed * (b.rush ? 2.2 : 1) * dt));
      b.phase += dt * 10;
      const s = Math.abs(Math.sin(b.phase));
      hopY = s * .32; sy = .88 + s * .2;
    }
  } else { // idle: look around now and then, then wander to a new spot
    if (Math.random() < dt * .25) b.lookAt = Math.random() * 7;
    if (b.lookAt !== undefined) b.heading = angLerp(b.heading, b.lookAt, dt * 2.5);
    if (now > b.until) { b.target = homeSpot(b); b.mode = 'walk'; b.lookAt = undefined; }
  }
  // keep a little personal space and stay on the deck
  for (const o of bots.values()) {
    if (o === b) continue;
    const dx = b.pos.x - o.pos.x, dz = b.pos.z - o.pos.z, d2 = dx * dx + dz * dz;
    if (d2 < 5.3 && d2 > 1e-4) { const d = Math.sqrt(d2), push = (2.3 - d) * dt * 2; b.pos.x += dx / d * push; b.pos.z += dz / d * push; }
  }
  const r = Math.hypot(b.pos.x, b.pos.z); if (r > DECK) b.pos.multiplyScalar(DECK / r);

  b.root.position.set(b.pos.x, Math.hypot(b.pos.x, b.pos.z) < 4.4 ? .42 : 0, b.pos.z);
  b.hop.position.y = hopY;
  b.squash.scale.set(1 / Math.sqrt(sy), sy, 1 / Math.sqrt(sy));
  b.turn.rotation.y = b.heading;
  b.shadow.material.opacity = Math.max(.15, 1 - hopY * .25);

  // eyes: blink every few seconds, hold expressions briefly
  if (now > b.exprUntil && b.expr !== 'neutral' && b.expr !== 'blink') b.expr = 'neutral';
  if (now > b.blinkAt) { b.expr = 'blink'; if (now > b.blinkAt + 140) { b.expr = 'neutral'; b.blinkAt = now + rand(2200, 6000); } }
  const [ex, ey, eo] = EXPR[b.expr];
  for (const m of b.eyes) {
    m.scale.x += (ex - m.scale.x) * Math.min(1, dt * 18);
    m.scale.y += (ey - m.scale.y) * Math.min(1, dt * 18);
    m.position.y += (eo - m.position.y) * Math.min(1, dt * 18);
  }

  // speech bubble pop in/out
  const bub = b.bubble;
  // bubbles step aside while an arrival card is on screen
  if (now < b.speakUntil && !cardUp) {
    const k = Math.min(1, (now - b.speakT0) / 350), s = k < 1 ? 1 + Math.sin(k * Math.PI) * .15 : 1;
    bub.sprite.scale.set(bub.base.x * s * k, bub.base.y * s * k, 1); bub.sprite.visible = true;
  } else if (bub.sprite.visible) {
    if (!b.hideT0) b.hideT0 = now;
    const k = 1 - Math.min(1, (now - b.hideT0) / 250);
    bub.sprite.scale.set(bub.base.x * k, bub.base.y * k, 1);
    if (k <= 0) { bub.sprite.visible = false; b.hideT0 = 0; }
  }
  if (bub.sprite.visible && now < b.speakUntil && !cardUp) b.hideT0 = 0;
  bub.tick(now);
}

// A few bots chatter at a time so the room stays readable.
setInterval(() => {
  if (document.hidden) return;
  const now = performance.now(), all = [...bots.values()];
  const talking = all.filter(b => now < b.speakUntil).length;
  if (talking >= 3 || !all.length) return;
  const quiet = all.filter(b => now >= b.speakUntil && b.mode !== 'arrive' && b.mode !== 'celebrate');
  if (quiet.length) speak(quiet[Math.floor(Math.random() * quiet.length)], 9000, false);
}, 3200);

// ───────────────────────── camera ─────────────────────────
const cam = { angle: .6, mode: 'orbit', look: new THREE.Vector3(0, 2, 0), tween: null, zoom: .55, zoomTarget: .55 };
const ORBIT_LOOK = new THREE.Vector3(0, 2.5, 0);
// zoom 0 = close, inside the lounge; 1 = high above the open dome
const orbitPos = () => {
  const z = cam.zoom, R = 22 + z * 12, y = 9 + z * z * 26;
  return new THREE.Vector3(Math.sin(cam.angle) * R, y + Math.sin(cam.angle * .7) * 2, Math.cos(cam.angle) * R);
};
addEventListener('wheel', e => {
  e.preventDefault();
  cam.zoomTarget = Math.min(1, Math.max(0, cam.zoomTarget + e.deltaY * .0012));
}, { passive: false });
const ease = t => t < .5 ? 4 * t * t * t : 1 - Math.pow(-2 * t + 2, 3) / 2;
function setCam(pos, look) { camera.position.copy(pos); cam.look.copy(look); camera.lookAt(look); }
function tweenTo(target, dur) {
  cam.tween = { from: camera.position.clone(), fromLook: cam.look.clone(), target, t0: performance.now(), dur };
  cam.mode = 'tween';
  return sleep(dur);
}
// Frame the new bot on the left third (the arrival card covers the right half) and keep following it.
async function flyTo(b) {
  const D = 8.5;
  const dir = camera.position.clone().setY(0).normalize();
  const right = dir.clone().negate().cross(new THREE.Vector3(0, 1, 0)).normalize();
  const halfW = D * Math.tan(camera.fov * Math.PI / 360) * camera.aspect;
  const lookOff = right.multiplyScalar(innerWidth > 800 ? halfW * .42 : 0).add(new THREE.Vector3(0, 1.6, 0));
  const posOff = lookOff.clone().addScaledVector(dir, D).add(new THREE.Vector3(0, 2.6, 0));
  await tweenTo(() => ({ pos: b.pos.clone().add(posOff), look: b.pos.clone().add(lookOff) }), 1800);
}
async function backToOrbit() {
  await tweenTo(() => ({ pos: orbitPos(), look: ORBIT_LOOK }), 1900);
  cam.mode = 'orbit';
}
setCam(orbitPos(), ORBIT_LOOK);

// ───────────────────────── animation loop ─────────────────────────
let last = performance.now();
function frame(now) {
  const dt = Math.min(.1, (now - last) / 1000); last = now;
  cam.zoom += (cam.zoomTarget - cam.zoom) * Math.min(1, dt * 5);
  if (cam.mode === 'orbit') { cam.angle += dt * .045; setCam(orbitPos(), ORBIT_LOOK); }
  else { const tw = cam.tween, e = ease(Math.min(1, (now - tw.t0) / tw.dur)), t = tw.target(); setCam(tw.from.clone().lerp(t.pos, e), tw.fromLook.clone().lerp(t.look, e)); }

  for (const b of bots.values()) updateBot(b, now, dt);

  pad.holo.rotation.y += dt * .5; pad.holo.rotation.x += dt * .2;
  const beamTarget = now < beamUntil ? .5 : .12;
  pad.beamMat.opacity += (beamTarget - pad.beamMat.opacity) * Math.min(1, dt * 4);
  for (const s of Object.values(stations)) s.orb.position.y = 4.9 + Math.sin(now * .002 + s.center.x) * .15;
  const mp = motes.attributes.position;
  for (let i = 0; i < mp.count; i++) { let y = mp.getY(i) + dt * .25; if (y > 14) y = 0; mp.setY(i, y); }
  mp.needsUpdate = true;
  for (let i = waves.length - 1; i >= 0; i--) {
    const w = waves[i], p = (now - w.t0) / 1600;
    if (p >= 1) { scene.remove(w.m); w.m.geometry.dispose(); w.m.material.dispose(); waves.splice(i, 1); continue; }
    w.m.scale.setScalar(1 + p * 9); w.m.material.opacity = (1 - p) * .9;
  }

  composer ? composer.render() : renderer.render(scene, camera);
  requestAnimationFrame(frame);
}
requestAnimationFrame(frame);

}

  first: ['Amara', 'Ben', 'Carys', 'Diego', 'Elif', 'Finn', 'Grace', 'Hugo', 'Isla', 'Jonah', 'Kemi', 'Leo', 'Mira', 'Nadia', 'Omar', 'Pia', 'Quinn', 'Rhys', 'Sana', 'Theo', 'Uma', 'Vik', 'Wren', 'Yara'],
  last: ['Ashby', 'Brook', 'Costa', 'Doyle', 'Evans', 'Fox', 'Gill', 'Hart', 'Iqbal', 'Jones', 'Khan', 'Lowe', 'Moss', 'Ng', 'Owusu', 'Price', 'Reid', 'Shah', 'Tran', 'Vance'],
  bot: ['Orbit', 'Wisp', 'Cobalt', 'Juniper', 'Flux', 'Pebble', 'Sprocket', 'Halo', 'Vesper', 'Nova', 'Ripple', 'Bramble', 'Quill', 'Zephyr', 'Marlow', 'Tinker', 'Pulse', 'Lumen'],
  skills: ['python', 'typescript', 'react', 'rust', 'go', 'llm', 'agents', 'postgres', 'design', 'security', 'ml', 'payments', 'iot', '3d', 'community', 'embeddings', 'nlp', 'devops'],
  ideas: {
    'gatekeeper': ['Face-free check-in using a one-time emoji handshake', 'Bouncer bot that spots duplicate tickets in real time', 'NFC wristband check-in with a fallback chat flow'],
    'know-your-members': ['“Who should I talk to?” bot for shy first-timers', 'Turns your X bio into a 3-word superpower badge', 'Map of who-knows-what across the whole community'],
    'event-autopilot': ['Agent that orders the right amount of pizza, live', 'Auto-schedules lightning talks by energy level', 'Bot that runs the hackathon timer and nags politely'],
    'open-venue-db': ['Open dataset of venues that welcome hackathons', 'Rates venues by wifi speed, measured by bots', 'Venue finder that filters by power sockets per seat'],
    'front-desk-revenue': ['Merch drop that unlocks when your PR merges', 'Dynamic pricing for late-night coffee', 'Sponsor matchmaking at the front desk'],
    'weird-stuff': ['A bot that only communicates in ASCII art', 'Plant that tweets when the room gets too loud', 'Rubber duck that actually answers back'],
  },
  fun: ['Has a cat called Kubernetes', 'Commits only on full moons', 'Owns 14 mechanical keyboards', 'Once deployed to prod from a ferry', 'Can name every London tube station', 'Thinks tabs vs spaces is solved (it’s tabs)'],
};
const UPDATES = [
  'auth flow works end to end 🎉', 'pivoting to a CLI, the UI was eating us alive', 'first real user just signed up!', 'demo video recorded, now fixing everything it exposed',
  'deployed to Vercel, it actually loads', 'pair-programming with my bot, it is winning', 'swapped the DB schema for the 3rd time', 'got realtime working, goosebumps',
  'pizza acquired, morale +40%', 'wrote tests. one passes. progress.', 'the bot just suggested a better name for the project', 'shipping v0.1 before code freeze 🚀',
  'found the bug: it was a timezone', 'README written, therefore it exists',
];
const pick = a => a[Math.floor(Math.random() * a.length)];
let spawnN = 0;
function fakeAttendee() {
  const f = pick(POOL.first), l = pick(POOL.last), track = pick(TRACKS).id;
  return {
    display_name: `${f} ${l}`, x_handle: `${f}${l}`.toLowerCase().slice(0, 13) + (++spawnN),
    linkedin_url: Math.random() < .6 ? `https://www.linkedin.com/in/${f}-${l}`.toLowerCase() : null,
    bot_name: pick(POOL.bot) + (Math.random() < .3 ? '-' + Math.floor(Math.random() * 99) : ''),
    building: pick(POOL.ideas[track]), skills: [...new Set([pick(POOL.skills), pick(POOL.skills), pick(POOL.skills)])],
    track, fun_fact: pick(POOL.fun),
  };
}
const demoState = { auto: false, timer: null, upTimer: null };
function demoUpdateLoop() {
  clearTimeout(demoState.upTimer);
  demoState.upTimer = setTimeout(() => {
    if (demoState.auto && bots.size && !busy) applyUpdate({ x_handle: pick([...bots.values()]).p.handle, text: pick(UPDATES) }, { animate: true });
    demoUpdateLoop();
  }, rand(4000, 9000));
}
function setAuto(on) {
  demoState.auto = on; clearInterval(demoState.timer);
  if (on) { demoState.timer = setInterval(() => { if (queue.length < 2) enqueue(fakeAttendee()); }, 14000); demoUpdateLoop(); }
  else clearTimeout(demoState.upTimer);
  feed(on ? '▶️' : '⏸️', '', '', `demo auto-spawn ${on ? 'on' : 'off'}`);
}

async function startDemo() {
  setLive('demo');
  for (const r of SEED) { addBot(r, { announce: false }); await sleep(80); }
  for (let i = 0; i < 4; i++) applyUpdate({ x_handle: pick(SEED).x_handle, text: pick(UPDATES) }, { animate: false });
  feed('🛰️', '', '', `${SEED.length} demo bots on deck`);
  await sleep(2500);
  enqueue(fakeAttendee());
  setAuto(true);
}

// ───────────────────────── live mode (Supabase) ─────────────────────────
async function startLive() {
  setLive('connecting');
  const sb = window.supabase.createClient(C.SUPABASE_URL, C.SUPABASE_ANON_KEY);
  const [{ data: rows, error: e1 }, { data: ups, error: e2 }] = await Promise.all([
    sb.from('checkins').select('*').order('created_at', { ascending: true }).limit(1000),
    sb.from('updates').select('*').order('created_at', { ascending: true }).limit(2000),
  ]);
  if (e1 || e2) { console.error('Supabase load failed', e1 || e2); setLive('off'); feed('⚠️', '', '', 'could not reach Supabase — check CONFIG'); }
  for (const r of rows || []) addBot(r, { announce: false });
  for (const u of ups || []) applyUpdate(u, { animate: false });
  feed('📡', '', '', `connected · ${bots.size} bots already on deck`);
  sb.channel('constellation')
    .on('postgres_changes', { event: 'INSERT', schema: 'public', table: 'checkins' }, p => enqueue(p.new))
    .on('postgres_changes', { event: 'INSERT', schema: 'public', table: 'updates' }, p => applyUpdate(p.new, { animate: true }))
    .subscribe(status => setLive(status === 'SUBSCRIBED' ? 'on' : ['CHANNEL_ERROR', 'TIMED_OUT', 'CLOSED'].includes(status) ? 'off' : 'connecting'));
}

// ───────────────────────── keyboard ─────────────────────────
addEventListener('keydown', e => {
  if (e.metaKey || e.ctrlKey || e.altKey) return;
  const k = e.key.toLowerCase();
  if (k === 'escape') dismissFocus?.();
  else if (k === 's') enqueue(fakeAttendee());
  else if (k === 'd') setAuto(!demoState.auto);
  else if (k === 'h') document.body.classList.toggle('hud-hidden');
  else if (k === 'f') document.fullscreenElement ? document.exitFullscreen() : document.documentElement.requestFullscreen?.().catch(() => {});
});

renderStats();
DEMO ? startDemo() : startLive();
</script>

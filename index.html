<style>

<script type="module">
import * as THREE from 'three';
import ForceGraph3D from 'https://cdn.jsdelivr.net/npm/3d-force-graph@1.80.1/+esm';
import SpriteText from 'https://cdn.jsdelivr.net/npm/three-spritetext@1.10.0/dist/three-spritetext.mjs';

const C = window.CONFIG;
const params = new URLSearchParams(location.search);
const HAS_DB = !!(C.SUPABASE_URL && C.SUPABASE_ANON_KEY);
const DEMO = !HAS_DB || params.get('demo') === '1';
const FONT = "'Space Grotesk', system-ui, sans-serif";
const MONO = "'JetBrains Mono', ui-monospace, monospace";
const $ = id => document.getElementById(id);
const sleep = ms => new Promise(r => setTimeout(r, ms));
// Wait for web fonts so canvas/sprite text renders in the right face.
await Promise.race([document.fonts.ready, sleep(2500)]);

// ───────────────────────── tracks & helpers ─────────────────────────
const TRACKS = [
  { id: 'gatekeeper',         label: 'Gatekeeper',         color: '#ff3b6b' },
  { id: 'know-your-members',  label: 'Know Your Members',  color: '#3bf0ff' },
  { id: 'event-autopilot',    label: 'Event Autopilot',    color: '#8f6bff' },
  { id: 'open-venue-db',      label: 'Open Venue DB',      color: '#39ff88' },
  { id: 'front-desk-revenue', label: 'Front Desk Revenue', color: '#ff8a1f' },
  { id: 'weird-stuff',        label: 'Weird Stuff',        color: '#ff4fd8' },
];
const TRACK = Object.fromEntries(TRACKS.map(t => [t.id, t]));
const NO_TRACK = { id: null, label: 'Free Roaming', color: '#c9d4ff' };

// All user-supplied text is untrusted: strip control chars, cap length, and only ever
// render it via textContent (DOM) or canvas fillText (sprites).
const clean = (s, n) => String(s ?? '').replace(/[\u0000-\u001f\u007f​-‏‪-‮]/g, ' ').replace(/\s+/g, ' ').trim().slice(0, n);
function sanitize(r) {
  const handle = clean(r.x_handle, 40).replace(/^@+/, '');
  if (!handle) return null;
  const skills = (Array.isArray(r.skills) ? r.skills : []).map(s => clean(s, 24)).filter(Boolean).slice(0, 6);
  return {
    handle, key: handle.toLowerCase(),
    name: clean(r.display_name, 60) || handle,
    bot: clean(r.bot_name, 40) || 'Grok Bot',
    building: clean(r.building, 140),
    skills,
    track: TRACK[r.track] ? r.track : null,
    fun: clean(r.fun_fact, 80),
    at: r.created_at ? new Date(r.created_at) : new Date(),
  };
}
const hash = s => [...s].reduce((h, c) => (h * 31 + c.charCodeAt(0)) >>> 0, 7);

const CLASSES = [
  ['Architect', '🏛️', ['backend', 'infra', 'database', 'sql', 'postgres', 'go', 'rust', 'cloud', 'devops', 'api', 'systems', 'neo4j', 'graph', 'scraping', 'maps', 'kubernetes']],
  ['Oracle', '🔮', ['ml', 'ai', 'llm', 'data', 'python', 'nlp', 'embeddings', 'rag', 'agents', 'analytics', 'vision', 'pytorch']],
  ['Illusionist', '🎭', ['design', 'ui', 'ux', 'frontend', 'react', '3d', 'css', 'animation', 'figma', 'audio', 'music', 'three', 'generative', 'art']],
  ['Herald', '📯', ['community', 'content', 'marketing', 'growth', 'social', 'writing', 'poetry', 'comms', 'voice', 'product']],
  ['Sentinel', '🛡️', ['security', 'auth', 'privacy', 'crypto', 'testing', 'qa', 'iot', 'payments', 'stripe', 'hardware']],
];
const ADJ = ['Neon', 'Quantum', 'Midnight', 'Solar', 'Rogue', 'Velvet', 'Chrome', 'Feral', 'Lunar', 'Turbo', 'Arcane', 'Glitch', 'Cosmic', 'Silent'];
function botClass(p) {
  const sk = p.skills.map(s => s.toLowerCase());
  let best = ['Wanderer', '🧭'], score = 0;
  for (const [name, ico, kws] of CLASSES) {
    const s = sk.filter(x => kws.some(k => k.length <= 3 ? x === k : x.includes(k))).length;
    if (s > score) { score = s; best = [name, ico]; }
  }
  return { name: `${ADJ[hash(p.key) % ADJ.length]} ${best[0]}`, icon: best[1] };
}

// ───────────────────────── textures & sprites ─────────────────────────
function canvasTex(c) { const t = new THREE.CanvasTexture(c); t.colorSpace = THREE.SRGBColorSpace; return t; }
const glowTex = (() => {
  const s = 128, c = document.createElement('canvas'); c.width = c.height = s;
  const g = c.getContext('2d'), gr = g.createRadialGradient(s / 2, s / 2, 0, s / 2, s / 2, s / 2);
  gr.addColorStop(0, 'rgba(255,255,255,1)'); gr.addColorStop(.18, 'rgba(255,255,255,.6)');
  gr.addColorStop(.45, 'rgba(255,255,255,.14)'); gr.addColorStop(1, 'rgba(255,255,255,0)');
  g.fillStyle = gr; g.fillRect(0, 0, s, s); return canvasTex(c);
})();
const ringTex = (() => {
  const s = 256, c = document.createElement('canvas'); c.width = c.height = s;
  const g = c.getContext('2d'); g.strokeStyle = '#fff'; g.lineWidth = 6; g.shadowColor = '#fff'; g.shadowBlur = 16;
  g.beginPath(); g.arc(s / 2, s / 2, s / 2 - 20, 0, Math.PI * 2); g.stroke(); return canvasTex(c);
})();
// Cute bot mascot: rounded head, dark face screen, big glowing eyes, antenna, smile.
// Two textures per colour (eyes open / happy-closed) so bots can blink by swapping maps.
const mascotCache = {};
function mascotTex(color, blink) {
  const k = color + blink; if (mascotCache[k]) return mascotCache[k];
  const S = 256, c = document.createElement('canvas'); c.width = c.height = S;
  const g = c.getContext('2d');
  const rr = (x, y, w, h, r) => { g.beginPath(); g.roundRect(x, y, w, h, r); };
  // antenna
  g.strokeStyle = '#c9d2ff'; g.lineWidth = 7; g.lineCap = 'round';
  g.beginPath(); g.moveTo(128, 62); g.lineTo(128, 30); g.stroke();
  g.shadowColor = color; g.shadowBlur = 22; g.fillStyle = color;
  g.beginPath(); g.arc(128, 26, 12, 0, Math.PI * 2); g.fill();
  // ears
  g.shadowBlur = 0; g.fillStyle = '#c9d2ff';
  rr(22, 112, 22, 50, 10); g.fill(); rr(212, 112, 22, 50, 10); g.fill();
  // head
  const hg = g.createLinearGradient(0, 60, 0, 220); hg.addColorStop(0, '#ffffff'); hg.addColorStop(1, '#cfd6f5');
  g.fillStyle = hg; rr(36, 60, 184, 160, 62); g.fill();
  // face screen
  g.fillStyle = '#070a18'; rr(56, 82, 144, 112, 44); g.fill();
  g.strokeStyle = color; g.globalAlpha = .55; g.lineWidth = 3; g.stroke(); g.globalAlpha = 1;
  // eyes
  g.shadowColor = color; g.shadowBlur = 26; g.fillStyle = '#ffffff'; g.strokeStyle = '#ffffff';
  for (const ex of [100, 156]) {
    if (blink) {
      g.lineWidth = 8; g.lineCap = 'round';
      g.beginPath(); g.arc(ex, 140, 14, Math.PI * 1.15, Math.PI * 1.85); g.stroke();
    } else {
      g.beginPath(); g.ellipse(ex, 132, 15, 21, 0, 0, Math.PI * 2); g.fill();
      g.shadowBlur = 0; g.fillStyle = color;
      g.beginPath(); g.ellipse(ex + 2, 136, 8, 12, 0, 0, Math.PI * 2); g.fill();
      g.fillStyle = '#ffffff'; g.beginPath(); g.arc(ex + 5, 128, 4.5, 0, Math.PI * 2); g.fill();
      g.shadowBlur = 26;
    }
  }
  // blush + smile
  g.shadowBlur = 0; g.fillStyle = 'rgba(255, 120, 170, .45)';
  g.beginPath(); g.ellipse(80, 166, 11, 6, 0, 0, Math.PI * 2); g.fill();
  g.beginPath(); g.ellipse(176, 166, 11, 6, 0, 0, Math.PI * 2); g.fill();
  g.strokeStyle = '#ffffff'; g.lineWidth = 5; g.lineCap = 'round';
  g.beginPath(); g.arc(128, 162, 11, Math.PI * .15, Math.PI * .85); g.stroke();
  return (mascotCache[k] = canvasTex(c));
}
const glowSprite = (color, scale, opacity = .8) => {
  const s = new THREE.Sprite(new THREE.SpriteMaterial({ map: glowTex, color, blending: THREE.AdditiveBlending, transparent: true, depthWrite: false, opacity }));
  s.scale.setScalar(scale); return s;
};
function label(text, height, color, weight = '700', font = FONT) {
  const t = new SpriteText(text, height, color);
  t.fontFace = font; t.fontWeight = weight; t.strokeWidth = 0.5; t.strokeColor = 'rgba(0,0,0,.85)';
  t.material.depthWrite = false; t.renderOrder = 5; return t;
}

// Speech bubble: canvas-drawn, word-wrapped, length-capped, typewriter animation.
const BUB = { font: 40, lineH: 50, pad: 30, labelH: 40, maxW: 700, tail: 24, scale: 0.082, maxLines: 4 };
function wrap(ctx, text, maxW, maxLines) {
  const lines = []; let cur = '';
  for (let w of text.split(' ').filter(Boolean)) {
    while (ctx.measureText(w).width > maxW) {
      let i = w.length; while (i > 1 && ctx.measureText(w.slice(0, i)).width > maxW) i--;
      if (cur) { lines.push(cur); cur = ''; }
      lines.push(w.slice(0, i)); w = w.slice(i);
    }
    const t = cur ? cur + ' ' + w : w;
    if (ctx.measureText(t).width <= maxW) cur = t; else { lines.push(cur); cur = w; }
  }
  if (cur) lines.push(cur);
  if (lines.length > maxLines) {
    lines.length = maxLines;

    c.width = Math.ceil(Math.max(340, ...lines.map(l => ctx.measureText(l).width)) + BUB.pad * 2);
    c.height = Math.ceil(BUB.pad * 2 + BUB.labelH + lines.length * BUB.lineH + BUB.tail);

    ctx.font = `500 ${BUB.font}px ${FONT}`; ctx.fillStyle = '#e6ebff';

}

    core.scale.setScalar(22); core.renderOrder = 4;

(async () => {

    let mod;

    catch { mod = await import('https://esm.sh/three@0.186.1/examples/jsm/postprocessing/UnrealBloomPass.js?external=three'); }

const cam = { angle: 0, mode: 'orbit', last: performance.now(), look: new THREE.Vector3(), tween: null };
const V = o => new THREE.Vector3(o.x || 0, o.y || 0, o.z || 0);
const ease = t => t < .5 ? 4 * t * t * t : 1 - Math.pow(-2 * t + 2, 3) / 2;
function setCam(pos, look) { cam.look.copy(look); Graph.cameraPosition(pos, look); }
function tweenTo(target, dur) {
  cam.tween = { from: Graph.camera().position.clone(), fromLook: cam.look.clone(), target, t0: performance.now(), dur };
  cam.mode = 'tween';
  return sleep(dur);
}
const orbitR = () => 600 + Math.min(bots.size, 80) * 5;
const orbitPos = () => { const R = orbitR(); return { x: Math.sin(cam.angle) * R, y: R * .3 + Math.sin(cam.angle * .6) * 60, z: Math.cos(cam.angle) * R }; };
Graph.cameraPosition(orbitPos(), { x: 0, y: 0, z: 0 });

// Frame the new bot on the left third of the screen (the arrival card covers the right half),
// and keep following it while the simulation settles.
async function flyTo(n) {
  const N = V(n), D = 165;
  const dir = N.clone().setY(N.y * .3); if (dir.length() < 1) dir.set(0, 0, 1); dir.normalize();
  const right = dir.clone().negate().cross(new THREE.Vector3(0, 1, 0)).normalize();
  const c = Graph.camera(), halfW = D * Math.tan(c.fov * Math.PI / 360) * (innerWidth / innerHeight);
  const shift = innerWidth > 800 ? halfW * .45 : 0;
  const lookOff = right.multiplyScalar(shift).add(new THREE.Vector3(0, 4, 0));
  const posOff = lookOff.clone().add(dir.multiplyScalar(D)).add(new THREE.Vector3(0, 18, 0));
  await tweenTo(() => { const P = V(n); return { pos: P.clone().add(posOff), look: P.add(lookOff) }; }, 1800);
}
async function backToOrbit() {
  await tweenTo(() => ({ pos: V(orbitPos()), look: new THREE.Vector3() }), 1700);
  cam.mode = 'orbit';
}

// ───────────────────────── animation loop ─────────────────────────
const shockwaves = [];
function frame(now) {
  const dt = Math.min(100, now - cam.last); cam.last = now;
  if (cam.mode === 'orbit') { cam.angle += dt * .00006; setCam(orbitPos(), new THREE.Vector3()); }
  else {
    const tw = cam.tween, e = ease(Math.min(1, (now - tw.t0) / tw.dur)), t = tw.target();
    setCam(tw.from.clone().lerp(t.pos, e), tw.fromLook.clone().lerp(t.look, e));
  }
  for (const n of nodes) {
    const f = n.fx3; if (!f) continue;
    if (f.spin) { f.spin.rotation.z += dt * .0006; f.spin.rotation.y += dt * .0003; }
    if (f.spin2) f.spin2.rotation.x += dt * .0004;
    if (n.kind !== 'bot') continue;
    const age = (now - f.born) / 1000;
    const s = age < 1.2 ? 1 - Math.pow(2, -10 * age) * Math.cos(age * 9) : 1;
    f.inner.scale.setScalar(Math.max(.01, s));
    f.body.position.y = Math.sin(now * .0016 + n.phase) * 1.2;
    if (now > f.blinkAt) {
      const closed = now < f.blinkAt + 150;
      f.core.material.map = mascotTex(n.color, closed);
      if (!closed) f.blinkAt = now + 2500 + Math.random() * 4500;
    }
    let g = 30 + Math.sin(now * .002 + n.phase) * 2, b = 1;
    if (f.pulse) {
      const p = (now - f.pulse) / 1400;
      if (p < 1) { g += Math.sin(p * Math.PI) * 40; b = 1 + Math.sin(p * Math.PI * 2) * .18 * (1 - p); }
      else f.pulse = 0;
    }
    f.glow.scale.setScalar(g); f.body.scale.setScalar(b);
    f.bubble.tick(now);
  }
  for (let i = shockwaves.length - 1; i >= 0; i--) {
    const w = shockwaves[i], p = (now - w.t0) / 1800;
    if (p >= 1) { w.sprite.parent?.remove(w.sprite); w.sprite.material.dispose(); shockwaves.splice(i, 1); continue; }
    w.sprite.scale.setScalar(10 + p * 190); w.sprite.material.opacity = (1 - p) * .9;
  }
  requestAnimationFrame(frame);
}
requestAnimationFrame(frame);

// ───────────────────────── data → scene ─────────────────────────
function addBot(row, { announce }) {
  const p = sanitize(row);
  if (!p || bots.has(p.key)) return null;
  const t = TRACK[p.track] || NO_TRACK;
  const parent = p.track ? hubs[p.track] : HQ;
  const px = parent.fx ?? 0, py = parent.fy ?? 0, pz = parent.fz ?? 0;
  const n = {
    id: 'bot:' + p.key, kind: 'bot', p, color: t.color, num: ++stats.arrivals, phase: Math.random() * 6,
    x: px + (Math.random() - .5) * 40, y: py + (Math.random() - .5) * 40, z: pz + (Math.random() - .5) * 40,
  };
  const pend = pendingUpdates.get(p.key);
  if (pend) { n.text = pend; n.tag = '● UPDATE'; pendingUpdates.delete(p.key); }
  nodes.push(n); bots.set(p.key, n);
  links.push({ source: parent.id, target: n.id, kind: 'bot', color: t.color });
  trackRows[p.track ?? 'none'].n++;

  refresh(); renderStats();

  if (announce) {
    feed('🛰️', p.handle, t.color, `${p.bot} came online · ${p.building || t.label}`);
    setTimeout(() => shockwave(n, t.color), 900);
  }
  return n;
}

function applyUpdate(row, { animate }) {
  const key = clean(row.x_handle, 40).replace(/^@+/, '').toLowerCase();
  const text = clean(row.text, 120);
  if (!key || !text) return;
  stats.updates++;
  const n = bots.get(key);
  if (!n) { pendingUpdates.set(key, text); renderStats(); return; }
  n.text = text; n.tag = '● UPDATE';
  if (n.fx3) { n.fx3.bubble.set(text, '● UPDATE', animate); if (animate) n.fx3.pulse = performance.now(); }
  if (animate) feed('💬', n.p.handle, n.color, text);
  renderStats();
}

// Arrival queue: one cinematic moment at a time.
const queue = []; let busy = false;
function enqueue(row) { queue.push(row); runQueue(); }
async function runQueue() {
  if (busy) return; busy = true;
  while (queue.length) {
    const n = addBot(queue.shift(), { announce: true });
    if (!n) continue;
    await sleep(600);
    await flyTo(n);
    showCard(n);
    await sleep(queue.length > 2 ? 2600 : 4200);
    hideCard();
    await backToOrbit();
  }
  busy = false;
}

const POOL = {
  first: ['Amara', 'Ben', 'Carys', 'Diego', 'Elif', 'Finn', 'Grace', 'Hugo', 'Isla', 'Jonah', 'Kemi', 'Leo', 'Mira', 'Nadia', 'Omar', 'Pia', 'Quinn', 'Rhys', 'Sana', 'Theo', 'Uma', 'Vik', 'Wren', 'Yara'],
  last: ['Ashby', 'Brook', 'Costa', 'Doyle', 'Evans', 'Fox', 'Gill', 'Hart', 'Iqbal', 'Jones', 'Khan', 'Lowe', 'Moss', 'Ng', 'Owusu', 'Price', 'Reid', 'Shah', 'Tran', 'Vance'],
  bot: ['Orbit', 'Wisp', 'Cobalt', 'Juniper', 'Flux', 'Pebble', 'Sprocket', 'Halo', 'Vesper', 'Nova', 'Ripple', 'Bramble', 'Quill', 'Zephyr', 'Marlow', 'Tinker', 'Pulse', 'Lumen'],
  skills: ['python', 'typescript', 'react', 'rust', 'go', 'llm', 'agents', 'postgres', 'design', 'security', 'ml', 'payments', 'iot', '3d', 'community', 'embeddings', 'nlp', 'devops'],
  ideas: {
    'gatekeeper': ['Face-free check-in using a one-time emoji handshake', 'Bouncer bot that spots duplicate tickets in real time', 'NFC wristband check-in with a fallback chat flow'],
    'know-your-members': ['“Who should I talk to?” bot for shy first-timers', 'Turns your X bio into a 3-word superpower badge', 'Map of who-knows-what across the whole community'],

    'front-desk-revenue': ['Merch drop that unlocks when your PR merges', 'Dynamic pricing for late-night coffee', 'Sponsor matchmaking at the front desk'],
    'weird-stuff': ['A bot that only communicates in ASCII art', 'Plant that tweets when the room gets too loud', 'Rubber duck that actually answers back'],
  },
  fun: ['Has a cat called Kubernetes', 'Commits only on full moons', 'Owns 14 mechanical keyboards', 'Once deployed to prod from a ferry', 'Can name every London tube station', 'Writes code in dark mode, lives in light mode', 'Thinks tabs vs spaces is solved (it’s tabs)'],
};
const UPDATES = [
  'auth flow works end to end 🎉', 'pivoting to a CLI, the UI was eating us alive', 'first real user just signed up!', 'demo video recorded, now fixing everything it exposed',
  'deployed to Vercel, it actually loads', 'pair-programming with my bot, it is winning', 'swapped the DB schema for the 3rd time', 'got realtime working, goosebumps',

];
const pick = a => a[Math.floor(Math.random() * a.length)];
let spawnN = 0;
function fakeAttendee() {
  const f = pick(POOL.first), l = pick(POOL.last), track = pick(TRACKS).id;
  const skills = [...new Set([pick(POOL.skills), pick(POOL.skills), pick(POOL.skills)])];
  return {
    display_name: `${f} ${l}`, x_handle: `${f}${l}`.toLowerCase() + (++spawnN),
    bot_name: pick(POOL.bot) + (Math.random() < .3 ? '-' + Math.floor(Math.random() * 99) : ''),
    building: pick(POOL.ideas[track]), skills, track, fun_fact: pick(POOL.fun), created_at: new Date().toISOString(),
  };
}
const demoState = { auto: false, timer: null, upTimer: null };
function demoUpdateLoop() {
  clearTimeout(demoState.upTimer);
  demoState.upTimer = setTimeout(() => {
    if (demoState.auto && bots.size && !busy) applyUpdate({ x_handle: pick([...bots.values()]).p.handle, text: pick(UPDATES) }, { animate: true });
    demoUpdateLoop();
  }, 4000 + Math.random() * 5000);
}
function setAuto(on) {
  demoState.auto = on; clearInterval(demoState.timer);
  if (on) { demoState.timer = setInterval(() => { if (queue.length < 2) enqueue(fakeAttendee()); }, 6000); demoUpdateLoop(); }
  else clearTimeout(demoState.upTimer);
  feed(on ? '▶️' : '⏸️', '', '', `demo auto-spawn ${on ? 'on' : 'off'}`);
}

async function startDemo() {
  setLive('demo');
  $('liveBadge').querySelector('span').textContent = 'SIMULATED';
  for (const r of SEED) { addBot(r, { announce: false }); await sleep(140); }
  for (let i = 0; i < 4; i++) applyUpdate({ x_handle: pick(SEED).x_handle, text: pick(UPDATES) }, { animate: false });
  feed('🛰️', '', '', `${SEED.length} demo bots in orbit`);
  await sleep(2500);
  enqueue(fakeAttendee());
  setAuto(true);
}

// ───────────────────────── live mode (Supabase) ─────────────────────────
async function startLive() {
  setLive('connecting');
  const sb = window.supabase.createClient(C.SUPABASE_URL, C.SUPABASE_ANON_KEY);
  const [{ data: rows, error: e1 }, { data: ups, error: e2 }] = await Promise.all([
    sb.from('checkins').select('*').order('created_at', { ascending: true }).limit(1000),
    sb.from('updates').select('*').order('created_at', { ascending: true }).limit(2000),
  ]);
  if (e1 || e2) { console.error('Supabase load failed', e1 || e2); setLive('off'); feed('⚠️', '', '', 'could not reach Supabase — check CONFIG'); }
  for (const r of rows || []) addBot(r, { announce: false });
  for (const u of ups || []) applyUpdate(u, { animate: false });
  feed('📡', '', '', `connected · ${bots.size} bots already in orbit`);
  sb.channel('constellation')
    .on('postgres_changes', { event: 'INSERT', schema: 'public', table: 'checkins' }, p => enqueue(p.new))
    .on('postgres_changes', { event: 'INSERT', schema: 'public', table: 'updates' }, p => applyUpdate(p.new, { animate: true }))
    .subscribe(status => setLive(status === 'SUBSCRIBED' ? 'on' : status === 'CHANNEL_ERROR' || status === 'TIMED_OUT' || status === 'CLOSED' ? 'off' : 'connecting'));
}

// ───────────────────────── keyboard ─────────────────────────
addEventListener('keydown', e => {
  if (e.metaKey || e.ctrlKey || e.altKey) return;
  const k = e.key.toLowerCase();
  if (k === 's') enqueue(fakeAttendee());
  else if (k === 'd') setAuto(!demoState.auto);
  else if (k === 'h') document.body.classList.toggle('hud-hidden');
  else if (k === 'f') document.fullscreenElement ? document.exitFullscreen() : document.documentElement.requestFullscreen?.().catch(() => {});
});

renderStats();
DEMO ? startDemo() : startLive();
</script>
